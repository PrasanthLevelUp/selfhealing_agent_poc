name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Test tag to run'
        required: false
        default: '@login-positive'
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --grep "${{ github.event.inputs.tag || '@login-positive' }}" --workers=1
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.json
            playwright-report/
            test-results/
